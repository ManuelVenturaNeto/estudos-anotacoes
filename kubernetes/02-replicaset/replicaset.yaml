apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-rs
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      container: principal
  template:
    metadata:
      labels:
        container: principal
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80


